 --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--sans:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
[data-theme=white]{--bg:#ffffff;--paper:#ffffff;--fg:#1d1d1f;--muted:#6e6e73;--link:#1f3b5c;--rule:#e5e5ea;--box:#f2f2f7}
[data-theme=night]{--bg:#16130f;--paper:#1c1915;--fg:#e8e0d2;--muted:#a0968a;--link:#e0a487;--rule:#3a332b;--box:#26211b;--wood:#5b3f27;--wood2:#3e2a19}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0 auto;max-width:48rem;padding:0 16px 5rem;background:var(--bg);color:var(--fg);font:17px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--link);text-decoration:none}
button{font:inherit;cursor:pointer;color:var(--fg)}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:.8rem 0 .4rem;font-size:.92rem;gap:.5rem}
.topbar a{color:var(--fg);opacity:.85}.pill{background:var(--link);color:var(--paper);border-radius:999px;padding:0 .45em;font-size:.78rem;margin-left:.2em}
header.lib{text-align:center;padding:1.2rem 0 .6rem}header.lib h1{font:400 2.3rem/1.15 var(--serif);margin:0;letter-spacing:.01em}header.lib.small h1{font-size:1.7rem}
.sub{color:var(--muted);margin:.3rem 0 0;font-style:italic;font-family:var(--serif)}
.search input{width:100%;font:inherit;padding:.7rem 1rem;border:1px solid var(--rule);border-radius:999px;background:var(--paper);color:var(--fg);margin:.6rem 0}
.results{margin:.4rem 0 1rem}.rh{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:.9rem 0 .2rem}
.tabs{display:flex;gap:.2rem;margin:1.2rem 0 .6rem;border-bottom:1px solid var(--rule);overflow-x:auto}
.tabs a{padding:.5rem .8rem;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}.tabs a.on{color:var(--fg);border-color:var(--link);font-weight:600}
/* shelves */
.shelf{margin:1.4rem 0 .4rem}.sh{display:flex;justify-content:space-between;align-items:baseline}.sh h2{font:600 1.1rem var(--serif);margin:0 0 .5rem}.sh .cnt{color:var(--muted);font:400 .8rem var(--sans);margin-left:.3rem}
.row{display:flex;gap:12px;overflow-x:auto;padding:4px 4px 0;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.plank{height:12px;margin-top:-2px;background:linear-gradient(var(--wood),var(--wood2));border-radius:2px;box-shadow:0 6px 10px -6px rgba(0,0,0,.45)}

      if(onlyBook==null && ids.length>1) h+='<div class="bookjump">'+ids.map(function(b){ return '<a href="#" data-jump="hb_'+b+'" style="--cc:'+coverColor(b)+'">'+esc(I.books[b].t)+' <span>'+byBook[b].length+'</span></a>'; }).join('')+'</div>';
      ids.forEach(function(b){
        var list=byBook[b].sort(function(x,y){ return x.c-y.c || x.h.parts[0][0]-y.h.parts[0][0] || x.h.parts[0][1]-y.h.parts[0][1]; });
        h+='<section class="hlbook-sec" id="hb_'+b+'"><div class="hbh" style="--cc:'+coverColor(b)+'"><span class="spine"></span><div><a href="#b/'+b+'" class="hbt">'+esc(I.books[b].t)+'</a><div class="au">'+esc(I.books[b].a)+' · '+list.length+' highlight'+(list.length===1?'':'s')+'</div></div></div>';
        var lastc=-1;
        list.forEach(function(x){
          if(x.c!==lastc){ lastc=x.c; h+='<div class="hlch">'+(x.c+1)+'. '+esc(I.books[b].toc[x.c]||'')+'</div>'; }
          h+='<div class="hlitem"><a class="q c-'+x.h.c+'" href="#b/'+b+'/'+x.c+'/'+x.h.id+'">'+esc(x.h.t)+'</a>'+
             (x.h.n?'<div class="sticky small" data-open="'+x.h.id+'"><div class="pin"></div>'+esc(x.h.n).replace(/\n/g,'<br>')+'</div>':'')+
             '<div class="hlact"><a href="#" data-open="'+x.h.id+'">'+(x.h.n?'Edit note':'+ Add sticky note')+'</a><span class="date">'+new Date(x.h.ts).toLocaleDateString()+'</span></div></div>';
        });
        h+='</section>';
      });
    } else {
      var notesL=[]; ids.forEach(function(b){ byBook[b].forEach(function(x){ if(x.h.n) notesL.push(x); }); });
      if(!notesL.length) h+='<p class="note center">No sticky notes yet — open a highlight and write one.</p>';
      h+='<div class="board">'+notesL.map(function(x,i){ var rot=((hash(x.h.id)%7)-3)*0.8; return '<div class="sticky note-'+x.h.c+'" style="transform:rotate('+rot+'deg)" data-open="'+x.h.id+'"><div class="pin"></div><div class="nt">'+esc(x.h.n).replace(/\n/g,'<br>')+'</div><div class="nq">“'+esc(x.h.t.length>140?x.h.t.slice(0,140)+'…':x.h.t)+'”</div><a class="nsrc" href="#b/'+x.b+'/'+x.c+'/'+x.h.id+'">'+esc(I.books[x.b].t)+' · ch. '+(x.c+1)+'</a></div>'; }).join('')+'</div>';
    }
    h+='<div class="backup"><button data-act="copyhl">Copy all as text</button><button data-act="exporthl">Download backup</button><label class="btnlike">Restore backup<input type="file" id="restore" accept=".json,application/json" hidden></label></div><p class="note center">Highlights are saved in this browser on this device. Download a backup now and then.</p>';
    app.innerHTML=h; document.title='Highlights & Notes'; scrollTo(0,0);
    var rf=document.getElementById('restore'); if(rf) rf.addEventListener('change',function(){ var f=rf.files[0]; if(!f) return; f.text().then(function(t){ try{ var o=JSON.parse(t); var src=o.highlights||o; var added=0; for(var b in src) for(var c in src[b]) src[b][c].forEach(function(h){ if(!findHl(h.id)){ H[b]=H[b]||{}; (H[b][c]=H[b][c]||[]).push(h); added++; } }); saveH(); toast('Restored '+added+' highlights'); route(); }catch(e){ toast('That file is not a highlights backup'); } }); });
  }
  function hlText(){
    var out=[]; var all=allHl(); var byBook={}; all.forEach(function(x){ (byBook[x.b]=byBook[x.b]||[]).push(x); });
    Object.keys(byBook).sort(function(a,b){return I.books[a].s.localeCompare(I.books[b].s);}).forEach(function(b){
      out.push('== '+I.books[b].t+' ('+I.books[b].a+') ==');
      byBook[b].sort(function(x,y){return x.c-y.c||x.h.parts[0][0]-y.h.parts[0][0];}).forEach(function(x){ out.push('['+(x.c+1)+'. '+(I.books[b].toc[x.c]||'')+'] “'+x.h.t+'”'+(x.h.n?'\n   Note: '+x.h.n:'')); });
      out.push('');
    });
    return out.join('\n');
  }

  /* ---------- router ---------- */
  function route(){
    closePop(); hideSelBar(); curRead=null; document.body.classList.remove('reading');
    var h=decodeURIComponent(location.hash.slice(1)), m;
    if((m=/^r\/(\d+)\/(\d+)$/.exec(h))){ document.body.classList.add('reading'); return chapterPage(+m[1],+m[2],null,true); }
    if((m=/^b\/(\d+)\/(\d+)(?:\/(\w+))?$/.exec(h))){ document.body.classList.add('reading'); return chapterPage(+m[1],+m[2],m[3]); }
    if((m=/^b\/(\d+)$/.exec(h))) return bookPage(+m[1]);
    if((m=/^tab\/(\w+)$/.exec(h))) return home(m[1]);
    if((m=/^shelf\/([ck]\d+)$/.exec(h))) return shelfPage(m[1]);
    if(h==='hl') return hlPage(null);
    if((m=/^hl\/(\d+)$/.exec(h))) return hlPage(+m[1]);
    home();
  }

  /* ---------- verse pop-up, settings ---------- */
  function closePop(){ pop.classList.remove('on'); pop.removeAttribute('data-mode'); pbody.innerHTML=''; }
  function showVerse(vid){
    pbody.innerHTML='<p class="loading">Loading verse…</p>'; pop.classList.add('on');
    getVerses().then(function(V){
      pbody.innerHTML='<div class="notranslate" translate="no"><div class="vh">'+esc(refName(vid))+'</div><div class="vt">'+esc(V[vid]||'(verse not found)')+'</div>'+
        '<div class="va">'+(BIBLE?'<a href="'+esc(BIBLE)+'#'+vid+'">Open in Bible ›</a>':'<span class="note">Recovery Version</span>')+'<button data-save="'+vid+'">★ Save to My Verses</button></div></div>';
    },function(){ pbody.innerHTML='<p>Could not load verse text. Make sure <b>library-verses.js</b> is present.</p>'; });
  }
  function showSettings(){
    pbody.innerHTML='<div class="set"><div class="sl">Text size</div><div class="row2"><button data-act="fs" data-d="-1">A−</button><span id="fsv">'+S.size+'</span><button data-act="fs" data-d="1">A+</button></div>'+
      '<div class="sl">Theme</div><div class="row2">'+[['paper','Paper'],['white','White'],['night','Night']].map(function(t){return '<button data-act="theme" data-t="'+t[0]+'" class="th-'+t[0]+(S.theme===t[0]?' on':'')+'">'+t[1]+'</button>';}).join('')+'</div>'+
      '<div class="sl">Line spacing</div><div class="row2">'+[[1.5,'Compact'],[1.7,'Normal'],[1.95,'Relaxed']].map(function(t){return '<button data-act="lh" data-v="'+t[0]+'" class="'+(S.lh==t[0]?'on':'')+'">'+t[1]+'</button>';}).join('')+'</div>'+
      '<div class="sl">Language</div><div class="row2"><button data-act="tr-en" class="'+(trOn()?'':'on')+'">English</button><button data-act="tr-es" class="'+(trOn()?'on':'')+'">Español (Google Translate)</button></div><p class="note">Google Translate sends the page text to Google to translate it. Bible verses stay in the Recovery Version. Highlighting works in English only.</p>'+
      '<div class="sl">Your Bible app link (optional)</div><div class="row2"><input id="bibleurl" type="url" placeholder="https://yourname.github.io/bible/" value="'+esc(BIBLE)+'"><button data-act="savebible">Save</button></div></div>';
    pop.classList.add('on');
  }
  function saveVerse(vid){
    var KEY='rcv_myverses_v1', s=store(KEY);
    if(!s||!s.lists) s={active:'Memorize',order:['Memorize','Speech'],lists:{'Memorize':[],'Speech':[]}};
    var l=s.lists[s.active]||s.lists[s.order[0]]; if(l.indexOf(vid)<0) l.push(vid);
    store(KEY,s); toast('Saved '+refName(vid)+' to “'+s.active+'”');
  }
  var tst=document.getElementById('toast'),tt;
  function toast(m){ tst.textContent=m; tst.classList.add('on'); clearTimeout(tt); tt=setTimeout(function(){tst.classList.remove('on');},1800); }
  function onScroll(){ var pb=document.getElementById('progbar'); if(!pb) return; var d=document.documentElement; var p=(scrollY)/(Math.max(1,d.scrollHeight-innerHeight)); pb.style.width=Math.min(100,Math.max(0,p*100))+'%'; }
  window.addEventListener('scroll',onScroll,{passive:true});
  var posT=null;
  window.addEventListener('scroll',function(){ if(!curRead) return; clearTimeout(posT); posT=setTimeout(function(){
    var rec=store('mb_recent')||[]; var r=rec[0]; if(!r||r.b!==curRead.b||r.c!==curRead.c) return;
    var d=document.documentElement; r.y=Math.round(scrollY); r.pct=Math.min(1,scrollY/Math.max(1,d.scrollHeight-innerHeight)); r.ts=Date.now(); store('mb_recent',rec); },400); },{passive:true});

  selbar.addEventListener('mousedown',function(e){ e.preventDefault(); });
  selbar.addEventListener('touchstart',function(e){ var b=e.target.closest('button'); if(b){ e.preventDefault(); b.click(); } },{passive:false});
  document.addEventListener('click',function(e){
    var t=e.target;
    if(t===pop){ if(pop.getAttribute('data-mode')==='hl'){ var ta=document.getElementById('notearea'); var sv=pop.querySelector('[data-act="savenote"]'); if(ta&&sv) return saveNote(sv.getAttribute('data-id')); } closePop(); return; }
    if(t.closest('#pop .x')){ if(pop.getAttribute('data-mode')==='hl'){ var sv2=pop.querySelector('[data-act="savenote"]'); if(sv2) return saveNote(sv2.getAttribute('data-id')); } closePop(); return; }
    var sb=t.closest('#selbar button'); if(sb){ var col=sb.getAttribute('data-hl'); if(col) addHighlight(col,false); else if(sb.getAttribute('data-act')==='hlnote') addHighlight('yellow',true); else if(sb.getAttribute('data-act')==='copysel'){ var s=window.getSelection().toString(); (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(function(){toast('Copied');},function(){}); } return; }
    var sv=t.closest('[data-save]'); if(sv){ saveVerse(sv.getAttribute('data-save')); return; }
    var j=t.closest('[data-jump]'); if(j){ e.preventDefault(); var el=document.getElementById(j.getAttribute('data-jump')); if(el) el.scrollIntoView(); return; }
    var vw=t.closest('[data-view]'); if(vw){ e.preventDefault(); hlView=vw.getAttribute('data-view'); store('mb_hlview',hlView); route(); return; }
    var op=t.closest('[data-open]'); if(op && !t.closest('a.nsrc')){ e.preventDefault(); openHl(op.getAttribute('data-open'),true); return; }
    var sw=t.closest('[data-color]'); if(sw){ var f=findHl(sw.getAttribute('data-id')); if(f){ var ta2=document.getElementById('notearea'); if(ta2) f.h.n=ta2.value.trim(); f.h.c=sw.getAttribute('data-color'); saveH(); openHl(f.h.id); if(curRead) rerender(); } return; }
    var a=t.closest('[data-act]'); if(a){
      var act=a.getAttribute('data-act');
      if(act==='settings') return showSettings();
      if(act==='tr-es'){ closePop(); return translateTo('es'); }
      if(act==='tr-en'){ closePop(); return translateTo('en'); }
      if(act==='trtoggle'){ return translateTo(trOn()?'en':'es'); }
      if(act==='savebible'){ var v=(document.getElementById('bibleurl').value||'').trim(); if(v && !/^https?:|^\.|^\//.test(v)) v='https://'+v; BIBLE=v; try{ localStorage.setItem('lib_bible_url',JSON.stringify(v)); }catch(e){} toast(v?'Bible link saved':'Bible link removed'); closePop(); route(); return; }
      if(act==='fs'){ S.size=Math.max(14,Math.min(30,S.size+ +a.getAttribute('data-d'))); applySettings(); document.getElementById('fsv').textContent=S.size; return; }
      if(act==='theme'){ S.theme=a.getAttribute('data-t'); applySettings(); showSettings(); return; }
      if(act==='lh'){ S.lh=+a.getAttribute('data-v'); applySettings(); showSettings(); return; }
      if(act==='savenote') return saveNote(a.getAttribute('data-id'));
      if(act==='delhl'){ var f2=findHl(a.getAttribute('data-id')); if(f2 && confirm('Delete this highlight'+(f2.h.n?' and its sticky note':'')+'?')){ H[f2.b][f2.c].splice(f2.i,1); if(!H[f2.b][f2.c].length) delete H[f2.b][f2.c]; if(!Object.keys(H[f2.b]).length) delete H[f2.b]; saveH(); closePop(); if(curRead) rerender(); else route(); } return; }
      if(act==='copyhl'){ var txt=hlText(); (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast('Copied all highlights');},function(){ prompt('Copy:',txt); }); return; }
      if(act==='exporthl'){ var blob=new Blob([JSON.stringify({app:'ministry-library',version:1,exported:new Date().toISOString(),highlights:H},null,1)],{type:'application/json'}); var u=URL.createObjectURL(blob); var dl=document.createElement('a'); dl.href=u; dl.download='highlights-backup-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(dl); dl.click(); setTimeout(function(){URL.revokeObjectURL(u); dl.remove();},500); return; }
    }
    var mk=t.closest('mark.hl, button.stk'); if(mk && !t.closest('a.r') && window.getSelection().isCollapsed){ openHl(mk.getAttribute('data-h')); return; }
    var r=t.closest('a.r'); if(r){ e.preventDefault(); showVerse(r.getAttribute('data-v')); }
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closePop(); });
  if(!('DecompressionStream' in window)){ app.innerHTML='<p class="loading">This browser is too old to open this file. Please update Safari or Chrome.</p>'; return; }
  window.addEventListener('hashchange',route); route();
})();
</script></body></html>
